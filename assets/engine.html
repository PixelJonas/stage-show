<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="icon" href="data:,">
<!-- SHOW: fonts. Link assets/fonts/fonts.css (written by scripts/fonts.py) here. -->
<style>
/* ===================== ENGINE 2026-11-18 =====================
   Edit only to fix an engine bug, then add +local to the version in both ENGINE comments.
   Contract: references/engine.md of the stage-show skill. */
:root{--bg:#101214;--fg:#F2F2F2;--acc:#F2F2F2;--ease:cubic-bezier(.2,.8,.2,1);--enter:380ms}
html,body{height:100%;margin:0}
html{overflow:hidden}   /* body contains and clips the stage, so its 1920 px box can't widen a phone's layout viewport */
body{position:relative;background:var(--bg);color:var(--fg);overflow:hidden;transition:background-color 1.2s ease;-webkit-font-smoothing:antialiased}
body.idle{cursor:none}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;overflow:hidden;background:var(--bg);
  transform-origin:50% 50%;transition:background-color 1.2s ease}
.scene{position:absolute;inset:0;visibility:hidden;transition:opacity .5s ease}
.scene.active{visibility:visible}
.scene.leaving{opacity:0}

[data-in]{opacity:0;transform:var(--from,translateY(24px));filter:blur(var(--blur,3px));
  transition:opacity .9s ease,transform 1.2s var(--ease),filter .9s ease;transition-delay:calc(var(--d,0)*1ms + var(--enter))}
[data-in=left]{--from:translateX(-40px)}
[data-in=right]{--from:translateX(40px)}
[data-in=down]{--from:translateY(-24px)}
[data-in=scale]{--from:scale(.94)}
[data-in=fade]{--from:none;--blur:0px}
.scene.on [data-in]{opacity:1;transform:none;filter:none}
.ch{display:inline-block;opacity:0;transform:translateY(.25em);
  transition:opacity .7s ease,transform 1s var(--ease);transition-delay:calc(var(--i)*38ms + var(--d,0)*1ms + var(--enter))}
.wd{display:inline-block;white-space:nowrap}
.scene.on .ch{opacity:1;transform:none}
.scene.on [data-step]:not(.shown) [data-in]{opacity:0;transform:var(--from,translateY(24px));filter:blur(var(--blur,3px))}
.scene.on [data-step]:not(.shown) .ch{opacity:0;transform:translateY(.25em)}
/* --d:0 stops an outer delay; a click sets --enter:0ms on the step it shows */
[data-step]{--d:0;opacity:0;transform:translateY(20px);transition:opacity .8s ease,transform 1s var(--ease)}
.scene.on [data-step].shown{opacity:1;transform:none;transition-delay:calc(var(--d,0)*1ms + var(--enter))}
.scene.leaving *{transition-delay:0s!important}
.scene.leaving :is([data-in],[data-step],.ch,[data-exit]){opacity:0;transform:translateY(-14px);filter:blur(2px);
  transition:opacity .45s ease,transform .5s ease,filter .45s ease}
.scene.leaving [data-in=fade]{transform:none;filter:none}   /* after the rule above: same specificity */
@media (prefers-reduced-motion:reduce){
  [data-in],[data-step],.ch{transform:none!important;filter:none!important;transition-duration:.3s!important}
  .ch{transition-delay:calc(var(--d,0)*1ms + var(--enter))}   /* a word fades in as one */
  [data-ambient],[data-ambient] *{animation:none!important;transition-property:opacity!important}
}

#progress{position:fixed;left:0;bottom:0;height:4px;width:0;background:var(--acc);z-index:19;transition:width .8s ease,opacity .4s ease}
#ui{position:fixed;right:16px;bottom:16px;z-index:20;display:flex;gap:4px;align-items:center;padding:6px;border-radius:999px;
  background:rgba(16,18,20,.86);color:#F2F2F2;font:600 15px/1 system-ui,sans-serif;backdrop-filter:blur(8px);transition:opacity .4s ease}
#ui button{all:unset;cursor:pointer;min-width:40px;height:40px;padding:0 6px;box-sizing:border-box;border-radius:20px;
  display:flex;align-items:center;justify-content:center;font-size:17px}
#ui button:hover{background:rgba(255,255,255,.14)}
#ui button:focus-visible{outline:2px solid #8CC8FF;outline-offset:1px}
#count{min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
body.idle #ui,body.idle #progress{opacity:0;pointer-events:none}
#black{position:fixed;inset:0;background:#000;z-index:30;opacity:0;pointer-events:none;transition:opacity .6s ease}
#black.on{opacity:1;pointer-events:auto}
#notes{position:fixed;left:16px;right:16px;bottom:72px;max-width:1100px;margin:auto;z-index:25;display:none;white-space:pre-line;
  background:rgba(16,18,20,.94);color:#F2F2F2;border-radius:16px;padding:20px 26px;font:400 19px/1.5 system-ui,sans-serif}
#notes.on{display:block}
#notes h3,#pp h3{margin:0 0 8px;font:700 15px/1.3 system-ui,sans-serif;color:#8CC8FF;letter-spacing:.02em}
#help{position:fixed;inset:0;z-index:26;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55)}
#help.on{display:flex}
#help .box{background:#16191C;color:#F2F2F2;border-radius:20px;padding:28px 34px;max-width:640px;font:400 18px/1.5 system-ui,sans-serif}
#help h2{margin:0 0 12px;font-size:22px}
#help table{border-collapse:collapse;width:100%}
#help td{padding:4px 0;vertical-align:top}
#help td:first-child{width:42%;padding-right:14px;color:#8CC8FF;font-weight:700}
#pp{display:none}
body.presenter{background:#0C0E10}
body.presenter #stage{left:24px;top:24px;transform-origin:0 0;box-shadow:0 0 0 1px #2A2F33}
body.presenter #pp{display:flex;position:fixed;top:24px;right:24px;bottom:24px;width:min(36vw,560px);flex-direction:column;gap:18px;
  color:#E8E8E8;font:400 22px/1.45 system-ui,sans-serif}
#pp .row{display:flex;gap:34px;font-variant-numeric:tabular-nums}
#pp .big{font-size:40px;font-weight:700;cursor:default}
#pp .now{font-size:26px;font-weight:700}
#ppWake{margin:0;color:#FFB4A8;font-weight:700}
#pp .notes{flex:1;overflow:auto;white-space:pre-line;background:#16191C;border-radius:14px;padding:18px 22px}
body.presenter #ui{right:auto;left:24px}
body.presenter #bPresenter{display:none}
body.presenter #black{inset:auto;left:36px;top:36px;z-index:21;padding:6px 14px;border-radius:8px;background:#C0392B;color:#fff;font:700 16px/1.2 system-ui,sans-serif}
body.presenter #black.on::after{content:attr(data-label)}
</style>
<style>
/* ===================== SHOW =====================
   A neutral demo: replace it with the show's design. */
:root{--bg:#E9E9E9;--fg:#1A1A1A;--acc:#1A1A1A;font-family:system-ui,sans-serif}
:root[data-tone=dark]{--bg:#1A1A1A;--fg:#E9E9E9;--acc:#E9E9E9}
.demo{position:absolute;inset:96px 140px 90px}
.demo h1{font-size:180px;line-height:.95;margin:200px 0 0;letter-spacing:-.03em}
.demo h2{font-size:96px;margin:0 0 60px;letter-spacing:-.02em}
.demo p{font-size:44px;margin:0 0 24px}
.demo .num{font-size:200px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.04em}
</style>
</head>
<body>
<div id="stage" role="region" aria-roledescription="presentation" aria-label="Stage show">
  <!-- SHOW: ambient layers (canvas, brand shapes) go here, before the scenes -->

  <!-- SHOW: scenes. Replace these demo scenes. -->
  <section class="scene" data-id="opening" aria-label="Opening">
    <div class="demo">
      <h1 data-split>Welcome</h1>
      <p data-in data-d="700">Starts in <b data-countdown="2030-01-01T09:00:00+01:00" data-done="a moment">–</b></p>
    </div>
  </section>
  <section class="scene" data-id="steps" aria-label="Three clicks">
    <div class="demo">
      <h2 data-in>Three clicks</h2>
      <p data-step="1">One</p>
      <p data-step="2">Two</p>
      <p data-step="3">Three <span data-count="42">42</span></p>
    </div>
  </section>
  <section class="scene" data-id="numbers" data-tone="dark" aria-label="Numbers">
    <div class="demo">
      <div class="num" data-in data-d="150"><span data-count="1200">1,200</span></div>
      <p data-in data-d="400">attendees</p>
      <p data-type data-d="900">Typed letter by letter.</p>
    </div>
  </section>
</div>

<div id="progress" aria-hidden="true"></div>
<div id="ui" role="toolbar">
  <button id="bPrev">←</button><span id="count" aria-live="polite"></span><button id="bNext">→</button>
  <button id="bNotes">N</button><button id="bPresenter">P</button><button id="bFull">⛶</button><button id="bHelp">?</button>
</div>
<div id="notes" aria-live="polite"></div>
<div id="help" role="dialog" aria-modal="true"><div class="box"><h2 id="helpTitle"></h2><table id="helpKeys"></table></div></div>
<div id="black" aria-hidden="true"></div>
<aside id="pp">
  <div class="row"><div><h3 data-ui="elapsed"></h3><div class="big" id="ppElapsed">0:00</div></div><div><h3 data-ui="clock"></h3><div class="big" id="ppClock"></div></div></div>
  <div><h3 data-ui="now"></h3><div class="now" id="ppNow"></div></div>
  <div><h3 data-ui="nextUp"></h3><div id="ppNext"></div></div>
  <p id="ppWake" data-ui="noWake" hidden></p>
  <div class="notes" id="ppNotes"></div>
</aside>

<script>
/* ===================== SHOW =====================
   Runs before the engine. Contract: references/engine.md. */
const SHOW = {
  locale: 'en-GB',
  ui: {},
  notes: {
    opening: 'Pre-show loop. Countdown runs to the start time.',
    steps: 'Click 1, 2, 3.',
    numbers: 'Say the number out loud.'
  },
  hooks: {},
  onScene(scene, prev){},
  onResize(scale){},
  onTick(now){}
};
</script>
<script>
/* ===================== ENGINE 2026-11-18 ===================== reads SHOW, exposes STAGE. */
(()=>{
'use strict';
const S = typeof SHOW==='object' && SHOW ? SHOW : {};
const W=1920, H=1080, ENTER=380, LEAVE=900;
const locale = S.locale || document.documentElement.lang || 'en';
const UI = Object.assign({
  title:'Keys', prev:'Back', next:'Next', notes:'Notes (rehearsal)', presenter:'Presenter view', full:'Fullscreen', help:'Keys',
  step:'click {s} of {n}', now:'Now', nextUp:'Next', elapsed:'Elapsed (click to reset)', clock:'Time', end:'End of show', black:'BLACK', noWake:'No screen wake lock: turn off display sleep',
  keys:[['Next','→ ↓ Space Enter PageDown, click'],['Back','← ↑ Backspace PageUp, click the left edge'],['First / last','Home / End'],
        ['Go to scene','number, then Enter'],['Black screen','B or .'],['Fullscreen','F (F5 from a clicker)'],
        ['Notes','N'],['Presenter view','P (second window, stays in sync)'],['This help','? or H, close with Esc']]
}, S.ui||{});
const $=id=>document.getElementById(id);
const root=document.documentElement, body=document.body, stage=$('stage');
const PRESENTER=new URLSearchParams(location.search).has('presenter');
const reduce=matchMedia('(prefers-reduced-motion: reduce)');
if(PRESENTER){ body.classList.add('presenter');
  const play=HTMLMediaElement.prototype.play; HTMLMediaElement.prototype.play=function(){ this.muted=true; return play.apply(this,arguments); };
  document.addEventListener('play',e=>{ e.target.muted=true; },true); }

/* ---- scenes ---- */
const SC=[...stage.querySelectorAll(':scope > .scene')].map(el=>{
  const own=[...el.querySelectorAll('[data-step]')].map(x=>+x.dataset.step||0);
  return {el, id:el.dataset.id||el.id, title:el.getAttribute('aria-label')||el.dataset.id||'', steps:Math.max(+(el.dataset.steps||0),0,...own)};
});
const seen=new Set();
SC.forEach(s=>{ if(!s.id||seen.has(s.id)) console.error('stage: every scene needs a unique data-id', s.el); seen.add(s.id); });
const hook=(s,name,...a)=>{ try{ S.hooks?.[s.id]?.[name]?.(s.el,...a); }catch(e){ console.error(e); } };

/* ---- prepare markup ---- */
document.querySelectorAll('[data-d]').forEach(el=>el.style.setProperty('--d',el.dataset.d));
// graphemes: a combining mark or a ZWJ emoji stays one letter
const seg=typeof Intl==='object' && Intl.Segmenter ? new Intl.Segmenter(locale,{granularity:'grapheme'}) : null;
const letters=t=>seg ? Array.from(seg.segment(t),x=>x.segment) : (t.match(/\P{M}\p{M}*(?:\u200D\P{M}\p{M}*)*|\p{M}+/gu)||[]);
document.querySelectorAll('[data-split]').forEach(el=>{
  let i=0; const label=el.textContent.normalize('NFC').replace(/\s+/g,' ').trim();
  const walk=node=>{ for(const c of [...node.childNodes]){
    if(c.nodeType===3){
      const frag=document.createDocumentFragment();
      c.textContent.normalize('NFC').split(/(\s+)/).forEach(tok=>{
        if(!tok) return;
        if(/^\s+$/.test(tok)){ frag.appendChild(document.createTextNode(' ')); return; }
        const w=document.createElement('span'); w.className='wd'; w.setAttribute('aria-hidden','true');
        for(const ch of letters(tok)){ const s=document.createElement('span'); s.className='ch'; s.textContent=ch; s.style.setProperty('--i',i++); w.appendChild(s); }
        frag.appendChild(w);
      });
      c.replaceWith(frag);
    } else if(c.nodeType===1) walk(c);
  }};
  walk(el); el.setAttribute('aria-label',label);
});
document.querySelectorAll('[data-type]').forEach(el=>{ if(!el.dataset.type) el.dataset.type=el.textContent.trim(); });

/* ---- timed effects: counters, typewriters ---- */
let timers=[]; const frames=[], runs=new WeakMap();      // element -> its latest run; an older run stops writing
function clearTimers(){ timers.forEach(clearTimeout); timers=[]; frames.forEach(cancelAnimationFrame); frames.length=0; }
const dOf=el=>{ const d=el.closest('[data-d],[data-step]'); return d?.hasAttribute('data-d') ? (+d.dataset.d||0) : 0; };   // a delay stops at a step: a step has only its own
function counters(list, base){
  list.forEach(n=>{
    const run={}; runs.set(n,run);
    const to=+n.dataset.count, dec=+(n.dataset.decimals||0), dur=+(n.dataset.dur||1700);
    const f=v=>v.toLocaleString(locale,{minimumFractionDigits:dec,maximumFractionDigits:dec});
    if(reduce.matches){ n.textContent=f(to); return; }
    n.textContent=f(0);
    const t0=performance.now()+base+dOf(n);
    const tick=now=>{ if(runs.get(n)!==run) return; const p=Math.min(1,Math.max(0,(now-t0)/dur)); n.textContent=f(to*(1-Math.pow(1-p,4))); if(p<1) frames.push(requestAnimationFrame(tick)); };
    frames.push(requestAnimationFrame(tick));
  });
}
function typers(list, base){
  list.forEach(el=>{
    const run={}; runs.set(el,run);
    const s=el.dataset.type, sp=+(el.dataset.speed||32);
    if(reduce.matches){ el.textContent=s; return; }
    el.textContent=''; let i=0;
    timers.push(setTimeout(()=>{ const iv=setInterval(()=>{ if(runs.get(el)!==run) return clearInterval(iv); el.textContent=s.slice(0,++i); if(i>=s.length) clearInterval(iv); },sp); timers.push(iv); }, base+dOf(el)));
  });
}

/* ---- navigation ---- */
let cur=-1, step=0, scale=1, entry=0, entered=false;     // entry counts scene changes; entered: the current scene's entrance has run
function stepClasses(el,k,max){ for(let j=1;j<=Math.max(max,1);j++) el.classList.toggle('s'+j, j<=k); el.style.setProperty('--step',k); }
function setHash(){ try{ history.replaceState(null,'','#'+encodeURIComponent(SC[cur].id)+(step?'/'+step:'')); }catch(e){} }
function applyStep(entering){
  const n=SC[cur], el=n.el, fresh=[];
  el.querySelectorAll('[data-step]').forEach(x=>{ const on=+x.dataset.step<=step;
    if(entering) x.style.removeProperty('--enter');                                                          // shown at entry: waits for the entrance
    else if(on && !x.classList.contains('shown')){ fresh.push(x); x.style.setProperty('--enter','0ms'); }    // shown by a click: starts at once
    x.classList.toggle('shown',on); });
  stepClasses(el,step,n.steps);
  if(entering) el.querySelectorAll('[data-type]').forEach(t=>{ runs.delete(t); t.textContent=reduce.matches? t.dataset.type : ''; });   // a typer waits empty until it is shown
  const live=sel=>[...el.querySelectorAll(sel)].filter(x=>!x.closest('[data-step]:not(.shown)') && (entering || fresh.some(f=>f.contains(x))));
  counters(live('[data-count]'), entering?ENTER:0); typers(live('[data-type]'), entering?ENTER:0);
  if(entering) hook(n,'enter');                                                                              // order: enter, then step(n)
  hook(n,'step',step); setHash(); updateUI();
}
function go(i,s=0,opt={}){
  i=Math.max(0,Math.min(SC.length-1,i|0)); const n=SC[i]; s=Math.max(0,Math.min(n.steps,s|0));
  if(i===cur){ if(s!==step){ step=s; if(entered) applyStep(false); else { setHash(); updateUI(); } } sync(opt); return; }   // before the entrance, the entrance applies the step
  const old=SC[cur];
  clearTimers();
  if(old){ const oe=old.el; oe.classList.remove('on'); oe.classList.add('leaving'); if(entered) hook(old,'leave');   // leave only after an enter
    setTimeout(()=>{ if(SC[cur].el!==oe){ oe.classList.remove('active','leaving'); stepClasses(oe,0,old.steps); } },LEAVE); }
  cur=i; step=s; entered=false; const me=++entry;
  if(!old) body.style.transition=stage.style.transition='none';   // the first scene shows its tone at once
  root.dataset.scene=n.id; root.dataset.tone=n.el.dataset.tone||'';
  n.el.classList.remove('leaving','on'); n.el.classList.add('active');
  n.el.querySelectorAll('[data-step]').forEach(x=>x.classList.remove('shown')); stepClasses(n.el,0,n.steps);
  void n.el.offsetWidth; if(!old) body.style.transition=stage.style.transition='';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ if(me!==entry) return; entered=true; n.el.classList.add('on'); applyStep(true); }));   // only the latest scene change enters
  try{ S.onScene?.(n, old||null); }catch(e){ console.error(e); }
  setHash(); updateUI(); sync(opt);
}
function next(){ if(cur<0) return; if(step<SC[cur].steps) go(cur,step+1); else if(cur<SC.length-1) go(cur+1,0); }
function prev(){ if(cur<0) return; if(step>0) go(cur,step-1); else if(cur>0) go(cur-1,SC[cur-1].steps); }
function fromHash(){ let id,s; try{ [id,s]=decodeURIComponent(location.hash.slice(1)).split('/'); }catch(e){ return null; } const i=SC.findIndex(x=>x.id===id); return i<0? null : [i,+s||0]; }

/* ---- chrome ---- */
const stepLabel=(n,s)=>n.title+(n.steps? ' – '+UI.step.replace('{s}',s).replace('{n}',n.steps) : '');
function updateUI(){
  const n=SC[cur]; if(!n) return;
  const note=(S.notes||{})[n.id]||'';
  $('count').textContent=`${cur+1} / ${SC.length}`;
  $('progress').style.width=(SC.length>1? cur/(SC.length-1)*100 : 100)+'%';
  const h=document.createElement('h3'); h.textContent=stepLabel(n,step);
  $('notes').replaceChildren(h, document.createTextNode(note));
  if(PRESENTER){
    $('ppNow').textContent=stepLabel(n,step);
    $('ppNext').textContent= step<n.steps ? stepLabel(n,step+1) : (SC[cur+1]? SC[cur+1].title : UI.end);
    $('ppNotes').textContent=note;
  }
}
let blackOn=false;
function setBlack(on,opt={}){ blackOn=!!on; $('black').classList.toggle('on',blackOn); if(!opt.remote) send({t:'black',on:blackOn}); }
function full(force){
  const on=!!document.fullscreenElement, want= force===undefined ? !on : force;
  try{ if(want&&!on) (root.requestFullscreen||root.webkitRequestFullscreen)?.call(root)?.catch?.(()=>{}); else if(!want&&on) document.exitFullscreen()?.catch?.(()=>{}); }catch(e){}
}
const help=on=>$('help').classList.toggle('on',on);
function fit(){
  if(PRESENTER){ const pw=Math.min(innerWidth*.36,560); scale=Math.min((innerWidth-pw-72)/W,(innerHeight-48)/H); stage.style.transform=`scale(${scale})`; }
  else { scale=Math.min(innerWidth/W,innerHeight/H); stage.style.transform=`translate(-50%,-50%) scale(${scale})`; }
  try{ S.onResize?.(scale); }catch(e){ console.error(e); }
}
const fmt=(sec)=>{ const d=Math.floor(sec/86400), h=Math.floor(sec%86400/3600), m=Math.floor(sec%3600/60), s=sec%60, p=x=>String(x).padStart(2,'0');
  return d? `${d}d ${p(h)}:${p(m)}:${p(s)}` : (h? `${h}:${p(m)}:${p(s)}` : `${m}:${p(s)}`); };
let t0=Date.now();
function clocks(){
  const now=Date.now(), hm=new Date(now).toLocaleTimeString(locale,{hour:'2-digit',minute:'2-digit'});
  document.querySelectorAll('[data-countdown]').forEach(el=>{ const ms=Date.parse(el.dataset.countdown)-now; el.textContent= ms>0 ? fmt(Math.ceil(ms/1000)) : (el.dataset.done ?? '0:00'); el.classList.toggle('done',ms<=0); });
  document.querySelectorAll('[data-clock]').forEach(el=>el.textContent=hm);
  if(PRESENTER){ $('ppClock').textContent=hm; $('ppElapsed').textContent=fmt(Math.floor((now-t0)/1000)); }
  try{ S.onTick?.(now); }catch(e){ console.error(e); }
}

/* ---- presenter link: postMessage, also from file:// ---- */
const TAG='stage-show';
let peer=PRESENTER? window.opener : null;
const opened=w=>{ try{ return !!w && w.opener===window; }catch(e){ return false; } };   // a window this one opened; still true after either reloads
function send(m){ try{ if(peer && !peer.closed) peer.postMessage(Object.assign({tag:TAG},m),'*'); }catch(e){} }
function sync(opt){ if(!opt.remote) send({t:'go',i:cur,s:step}); }
function openPresenter(){
  if(PRESENTER) return;
  const u=new URL(location.href); u.searchParams.set('presenter','1');
  const w=window.open(u.href,'stage-presenter','popup,width=1400,height=820'); if(w) peer=w;
}
addEventListener('message',e=>{
  const m=e.data; if(!m || m.tag!==TAG) return;
  if(PRESENTER){
    if(e.source!==window.opener) return;
    if(m.t==='go') go(m.i,m.s,{remote:true}); else if(m.t==='black') setBlack(m.on,{remote:true}); else if(m.t==='want'){ send({t:'go',i:cur,s:step}); send({t:'black',on:blackOn}); }
    return;
  }
  if(m.t==='ping'){
    if(!opened(e.source)) return;                                     // only the presenter this window opened pairs with it
    if(m.first){ peer=e.source; send({t:'go',i:cur,s:step}); send({t:'black',on:blackOn}); }
    else if(peer!==e.source){ peer=e.source; send({t:'want'}); }      // audience was reloaded: take the presenter's state
    return;
  }
  if(e.source!==peer) return;
  if(m.t==='go') go(m.i,m.s,{remote:true}); else if(m.t==='black') setBlack(m.on,{remote:true});
});

/* ---- input: keyboard, clicker, mouse, touch ---- */
let jump='', jt;
addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  const k=e.key;
  if(/^(Shift|Control|Alt|AltGraph|Meta|OS|Super|Hyper|CapsLock|NumLock|ScrollLock|Fn|FnLock|Symbol|SymbolLock)$/.test(k)) return;   // a bare modifier is no key press: Shift alone would end the black screen before Shift+B
  if(k==='F5') e.preventDefault();                                 // clicker "start" key: never reload, also with help open or held
  if(e.repeat){ if(['ArrowRight','ArrowDown','PageDown',' ','Enter','ArrowLeft','ArrowUp','PageUp','Backspace','b','B','.'].includes(k)) e.preventDefault(); return; }   // a held key neither runs through the show nor flickers the black screen
  if($('help').classList.contains('on')){ if(['Escape','?','h','H'].includes(k)){ e.preventDefault(); help(false); } return; }
  if(/^[0-9]$/.test(k)){ jump+=k; clearTimeout(jt); jt=setTimeout(()=>jump='',2500); return; }
  if(k==='Enter' && jump){ e.preventDefault(); const j=+jump; jump=''; if(j>=1) go(j-1,0); return; }
  if(blackOn && !['b','B','.'].includes(k)){ e.preventDefault(); setBlack(false); return; }
  if(['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(k)){ if((k===' '||k==='Enter') && document.activeElement?.closest?.('#ui')) return; e.preventDefault(); next(); }
  else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(k)){ e.preventDefault(); prev(); }
  else if(k==='Home'){ e.preventDefault(); go(0,0); }
  else if(k==='End'){ e.preventDefault(); go(SC.length-1,0); }
  else if(k==='b'||k==='B'||k==='.'){ e.preventDefault(); setBlack(!blackOn); }
  else if(k==='F5'){ if(!document.fullscreenElement) full(true); }
  else if(k==='f'||k==='F'){ e.preventDefault(); full(); }
  else if(k==='n'||k==='N'){ $('notes').classList.toggle('on'); }
  else if(k==='p'||k==='P'){ openPresenter(); }
  else if(k==='?'||k==='h'||k==='H'){ help(true); }
});
const btn=(id,key,fn)=>{ const b=$(id); b.title=UI[key]; b.setAttribute('aria-label',UI[key]); b.onclick=e=>{ e.stopPropagation(); fn(); }; };
btn('bPrev','prev',()=>prev()); btn('bNext','next',()=>next()); btn('bNotes','notes',()=>$('notes').classList.toggle('on'));
btn('bPresenter','presenter',openPresenter); btn('bFull','full',()=>full()); btn('bHelp','help',()=>help(true));
$('ui').setAttribute('aria-label',UI.title);
$('ui').addEventListener('mousedown',e=>e.preventDefault());       // focus stays put, so Space/Enter keep advancing after a click
$('help').onclick=e=>{ if(e.target===$('help')) help(false); };
$('black').dataset.label=UI.black; $('black').onclick=()=>setBlack(false);
$('ppElapsed').title=UI.elapsed; $('ppElapsed').onclick=()=>{ t0=Date.now(); clocks(); };
document.querySelectorAll('#pp [data-ui]').forEach(el=>el.textContent=UI[el.dataset.ui]);
$('helpTitle').textContent=UI.title;
$('helpKeys').replaceChildren(...UI.keys.map(([a,b])=>{ const tr=document.createElement('tr'); tr.innerHTML='<td></td><td></td>'; tr.cells[0].textContent=a; tr.cells[1].textContent=b; return tr; }));
stage.addEventListener('click',e=>{ const r=stage.getBoundingClientRect(); (e.clientX-r.left < r.width*.2) ? prev() : next(); });
let tx=null;
addEventListener('touchstart',e=>{ tx=e.touches[0].clientX; },{passive:true});
addEventListener('touchend',e=>{ if(tx===null) return; const dx=e.changedTouches[0].clientX-tx; if(Math.abs(dx)>50) (dx<0? next : prev)(); tx=null; },{passive:true});
let idleT; const wake=()=>{ body.classList.remove('idle'); clearTimeout(idleT); if(!PRESENTER) idleT=setTimeout(()=>body.classList.add('idle'),2500); };
addEventListener('mousemove',wake); wake();
let lock=null;
const warn=on=>{ const w=$('ppWake'); if(w) w.hidden=!on; };   // #ppWake sits outside ENGINE: a show may lack it
const awake=async()=>{ try{ if(!lock && 'wakeLock' in navigator && document.visibilityState==='visible'){ lock=await navigator.wakeLock.request('screen'); lock.addEventListener('release',()=>{ lock=null; warn(true); }); } }catch(e){} warn(!lock); };
addEventListener('keydown',awake); addEventListener('pointerdown',awake); document.addEventListener('visibilitychange',awake);
awake();   // at load too: a title or pre-show loop keeps the screen awake before the first key
addEventListener('resize',fit);
addEventListener('hashchange',()=>{ const h=fromHash(); if(h && (h[0]!==cur || h[1]!==step)) go(h[0],h[1]); });

/* ---- start ---- */
window.STAGE={
  scenes:SC.map(s=>({id:s.id,title:s.title,steps:s.steps})),
  go:(i,s=0)=>{ if(typeof i==='string') i=SC.findIndex(x=>x.id===i); if(i>=0) go(i,s); },
  next, prev,
  state:()=>({i:cur,id:SC[cur]?.id,step,steps:SC[cur]?.steps??0}),
  get scale(){ return scale; }, get still(){ return reduce.matches; }, presenter:PRESENTER
};
fit(); clocks(); setInterval(clocks,1000);
if(PRESENTER && window.opener){ send({t:'ping',first:true}); setInterval(()=>send({t:'ping'}),2000); }
const h=fromHash();
const start=()=>{ if(cur<0) go(h?h[0]:0, h?h[1]:0, {remote:PRESENTER}); };   // a presenter shows its URL position until the audience answers, and never sends it
Promise.race([document.fonts?.ready||Promise.resolve(), new Promise(r=>setTimeout(r,1500))]).then(start);
})();
</script>
